# Release: bump Chart.yaml version, create git tag (e.g. v0.2.0), push umbrella chart to OCI.
# Manual: Actions → "Release Helm chart" → Run workflow → enter version (e.g. 0.2.0).
name: Release Helm chart

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CORE_CHART_PATH: .
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY == '' && 'ghcr.io' || vars.OCI_REGISTRY }}
      OCI_REPO_CORE: ${{ vars.OCI_CHART_REPO == '' && 'finetech-nexus/core-api-charts' || vars.OCI_CHART_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Chart.yaml version
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.release_version }}"
          if [ -z "$VERSION" ]; then echo "release_version is required"; exit 1; fi
          sed -i "s/^version: .*/version: ${VERSION}/" Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" Chart.yaml
          echo "Chart versions set to ${VERSION}"
          grep -E '^(version|appVersion):' Chart.yaml

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Chart.yaml
          git diff --staged --quiet || git commit -m "chore: release ${{ github.event.inputs.release_version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create and push tag
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.release_version }}"
          TAG="v${VERSION}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Enable Helm OCI
        run: echo "HELM_EXPERIMENTAL_OCI=1" >> $GITHUB_ENV

      - name: Helm dependency build
        run: |
          set -euo pipefail
          helm dependency build ${{ env.CORE_CHART_PATH }}

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          rm -rf ./out
          mkdir -p ./out
          CORE_TGZ="$(helm package ${{ env.CORE_CHART_PATH }} --destination ./out | sed -n 's/^Successfully packaged chart and saved it to: //p')"
          if [ -z "$CORE_TGZ" ]; then
            echo "Failed to resolve packaged chart path"
            exit 1
          fi
          echo "core_chart_tgz=${CORE_TGZ}" >> "$GITHUB_OUTPUT"

      - name: Log in to OCI registry (GHCR)
        if: env.OCI_REGISTRY == 'ghcr.io'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Log in to OCI registry (Oracle OCIR or other)
        if: env.OCI_REGISTRY != 'ghcr.io'
        env:
          OCI_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
        run: |
          echo "$OCI_PASSWORD" | helm registry login ${{ env.OCI_REGISTRY }} -u "$OCI_USERNAME" --password-stdin

      - name: Push chart to OCI
        run: |
          set -euo pipefail
          helm push ${{ steps.package.outputs.core_chart_tgz }} oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_REPO_CORE }}
