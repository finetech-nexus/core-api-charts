# Build and push the umbrella Helm chart to an OCI registry (GitHub GHCR or Oracle OCIR).
# On push to main or master (or manual run): build and push chart (version from Chart.yaml).
#
# GHCR (default): no extra config. Uses GITHUB_TOKEN; chart pushed to ghcr.io/finetech-nexus/core-api-charts.
# Oracle OCIR: repo Variables OCI_REGISTRY, OCI_CHART_REPO; Secrets OCI_REGISTRY_USERNAME, OCI_REGISTRY_PASSWORD.
name: Publish Helm chart (OCI)

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'Chart.yaml'
      - 'values.yaml'
      - 'templates/**'
      - 'kyc-api/**'
      - 'ai-api/**'
      - 'produit-api/**'
      - 'produit-app/**'
      - 'card-management-api/**'
      - 'invest-api/**'
      - 'subscription-api/**'
      - '.github/workflows/publish-helm-chart.yml'
  workflow_dispatch:

jobs:
  push-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CORE_CHART_PATH: .
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY == '' && 'ghcr.io' || vars.OCI_REGISTRY }}
      OCI_REPO_CORE: ${{ vars.OCI_CHART_REPO == '' && 'finetech-nexus/core-api-charts' || vars.OCI_CHART_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Enable Helm OCI
        run: echo "HELM_EXPERIMENTAL_OCI=1" >> $GITHUB_ENV

      - name: Helm dependency build
        run: |
          set -euo pipefail
          helm dependency build ${{ env.CORE_CHART_PATH }}

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          rm -rf ./out
          mkdir -p ./out
          CORE_TGZ="$(helm package ${{ env.CORE_CHART_PATH }} --destination ./out | sed -n 's/^Successfully packaged chart and saved it to: //p')"
          if [ -z "$CORE_TGZ" ]; then
            echo "Failed to resolve packaged chart paths"
            exit 1
          fi
          echo "core_chart_tgz=${CORE_TGZ}" >> "$GITHUB_OUTPUT"

      - name: Log in to OCI registry (GHCR)
        if: env.OCI_REGISTRY == 'ghcr.io'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Log in to OCI registry (Oracle OCIR or other)
        if: env.OCI_REGISTRY != 'ghcr.io'
        env:
          OCI_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
        run: |
          echo "$OCI_PASSWORD" | helm registry login ${{ env.OCI_REGISTRY }} -u "$OCI_USERNAME" --password-stdin

      - name: Push chart to OCI
        run: |
          set -euo pipefail
          helm push ${{ steps.package.outputs.core_chart_tgz }} oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_REPO_CORE }}
