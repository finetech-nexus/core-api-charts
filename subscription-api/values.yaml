replicaCount: 1
image:
  repository: nexusbank/subscription-api
  tag: latest
  pullPolicy: Always
env:
  PORT: "8080"
  DISABLE_AUTH: "false"
  KEYCLOAK_ISSUER_URI: "https://iam.dev.sandbox.internal.nbank.fr/auth/realms/customer"
  KEYCLOAK_JWK_SET_URI: "https://iam.dev.sandbox.internal.nbank.fr/auth/realms/customer/protocol/openid-connect/certs"
  JPA_DDL_AUTO: update
extraEnv: ""
hostAliases: []
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: false
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    cert-manager.io/cluster-issuer: nbank-dev
  hosts:
    - host: subscription-api.api.dev.sandbox.internal.nbank.fr
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
persistence:
  # Enable only to retain an existing H2 claim during migration. PostgreSQL is the chart default.
  enabled: false
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClass: ""
  mountPath: /data
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
livenessProbe:
  enabled: true
  initialDelaySeconds: 45
  periodSeconds: 15
readinessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 10
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: subscription
    database: subscriptions
    # A stable random password is generated and retained in a Kubernetes Secret when blank.
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password
  service:
    port: 5432
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
