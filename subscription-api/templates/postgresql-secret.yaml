{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secretName := include "subscription-api.postgresql.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgresql.auth.password -}}
{{- if eq $password "" -}}
  {{- if and $existing (hasKey $existing.data "password") -}}
    {{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 36 -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "subscription-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
