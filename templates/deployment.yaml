apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "self-service.fullname" . }}
  labels:
    {{- include "self-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "self-service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "self-service.name" . }}
    spec:
      hostAliases: {{ toYaml .Values.hostAliases | nindent 8 }}
      containers:
        - name: self-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: FINERACT_BASE_URL
              value: "{{ .Values.env.FINERACT_BASE_URL }}"
            - name: FINERACT_TENANT
              value: "{{ .Values.env.FINERACT_TENANT }}"
            - name: KEYCLOAK_URL
              value: "{{ .Values.env.KEYCLOAK_URL }}"
            - name: KEYCLOAK_REALM
              value: "{{ .Values.env.KEYCLOAK_REALM }}"
            - name: KEYCLOAK_CLIENT_ID
              value: "{{ .Values.env.KEYCLOAK_CLIENT_ID }}"
            - name: KEYCLOAK_CLIENT_SECRET
              value: "{{ .Values.env.KEYCLOAK_CLIENT_SECRET }}"
              {{- with .Values.extraEnv }}
              {{- tpl . $ | nindent 12 }}
              {{- end }}
          livenessProbe:
            {{- if .Values.livenessProbe.enabled }}
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            {{- end }}
          readinessProbe:
            {{- if .Values.readinessProbe.enabled }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            {{- end }}
          volumeMounts:
{{- toYaml .Values.extraVolumeMounts | nindent 12 }}
      volumes:
{{- toYaml .Values.extraVolumes | nindent 8 }}

      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
