apiVersion: v2
name: core-api
description: Umbrella chart for Nexus Bank APIs (core-banking-api, kyc-api, ai-api, produit-api, produit-app, card-management-api, invest-api)
type: application
version: 0.2.4
appVersion: "1.0.0"
dependencies:
  - name: core-banking-api
    version: 0.1.1
    repository: file://./core-banking-api
  - name: kyc-api
    version: 0.1.1
    repository: file://./kyc-api
  # Opt-in per environment: ai-api ships a multi-GB ML image and shares this
  # release, so it must be enabled deliberately.
  - name: ai-api
    version: 0.1.0
    repository: file://./ai-api
    condition: ai-api.enabled
  - name: produit-api
    version: 0.1.0
    repository: file://./produit-api
  - name: produit-app
    version: 0.1.0
    repository: file://./produit-app
    condition: produit-app.enabled
  - name: card-management-api
    version: 0.1.0
    repository: file://./card-management-api
  - name: invest-api
    version: 0.1.0
    repository: file://./invest-api
