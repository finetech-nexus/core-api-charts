apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "produit-api.fullname" . }}
  labels:
    {{- include "produit-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "produit-api.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "produit-api.name" . }}
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            - >-
              until pg_isready -h "${PGHOST}" -p "${PGPORT}"; do echo waiting for PostgreSQL; sleep 2; done
          env:
            - name: PGHOST
              value: {{ include "produit-api.postgresql.fullname" . | quote }}
            - name: PGPORT
              value: {{ .Values.postgresql.service.port | quote }}
      {{- end }}
      containers:
        - name: produit-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- range $key, $val := .Values.env }}
            {{- if not (and $.Values.postgresql.enabled (has $key (list "DATABASE_URL" "DATABASE_USERNAME" "DATABASE_PASSWORD" "H2_CONSOLE_ENABLED"))) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s" (include "produit-api.postgresql.fullname" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default (include "produit-api.postgresql.fullname" .) }}
                  key: {{ .Values.postgresql.auth.existingSecretPasswordKey }}
            - name: H2_CONSOLE_ENABLED
              value: "false"
            {{- end }}
            {{- with .Values.extraEnv }}
              {{- tpl . $ | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
