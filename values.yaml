core-banking-api:
  caConfigMap:
    create: false
  replicaCount: 1
  hostAliases:
    - ip: "172.18.0.3"
      hostnames:
        - "iam.nexus-bank.io"
        - "fynams.sandbox.nexus-bank.io"
        - "channel.mifos.gazelle.test"
  image:
    repository: nexusbank/core-banking-api
    tag: "latest"
    pullPolicy: Always

  env:
    KEYCLOAK_URL: "https://iam.nexus-bank.io/auth"
    KEYCLOAK_REALM: "customer"
    KEYCLOAK_CLIENT_ID: "selfService-app-oidc"
    KEYCLOAK_CLIENT_SECRET: "A4NSNrehcwU8t0LAmfVly1qAgnJlEuqm"
    SUBJECT_ISSUER: "keycloak-oidc"
    KEYCLOAK_ADMIN_CLIENT_ID: "selfService-registration-app-oidc"
    KEYCLOAK_ADMIN_CLIENT_SECRET: "bBqdDdctb02hQ1x9TDUtZ6xtdyfeij1j"
    KEYCLOAK_INTERNAL_REALM: "internal"
    KEYCLOAK_FINERACT_CLIENT_ID: "selfService-app-oidc"
    KEYCLOAK_FINERACT_CLIENT_SECRET: "PW9Vn1dxI2VS8V6fsyyZvgnkoPtWbp10"
    KEYCLOAK_FINERACT_USERNAME: "mifos"
    KEYCLOAK_FINERACT_PASSWORD: "password"
    FINERACT_BASE_URL: "https://fynams.sandbox.nexus-bank.io"
    FINERACT_BASE_PATH: "/fineract-provider/api/v1"
    FINERACT_TENANT: "nexusbank"
    DEFAULT_SAVING_PRODUCT: 4
    SAVING_PRODUCTS:
      TND: "4"
      EURO: "3"
      USD: "2"
    OFFICE_ID: 5
    SWIFT_BIC: "NEXUSTN"
    BANK_CODE: "30000000"
    COUNTRY_CODE: "TN"

  extraEnv: |
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/certificate/ca.pem

  extraVolumes:
    - name: certificate
      configMap:
        name: ca-config-map
  extraVolumeMounts:
    - name: certificate
      mountPath: /etc/certificate
      readOnly: true

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-buffers: "416k"
      cert-manager.io/cluster-issuer: nbank
    hosts:
      - host: cbanking-api.sandbox.nexus-bank.io
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - cbanking-api.sandbox.nexus-bank.io
        secretName: "selfservice-tls"

  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

kyc-api:
  replicaCount: 1
  image:
    repository: nexusbank/kyc-api
    tag: "latest"
    pullPolicy: Always
  env:
    PORT: 3000
    NODE_ENV: production
    LOG_LEVEL: info
    BALLERINE_ENDPOINT: "https://workflowsvc.kyc.dev.sandbox.internal.nbank.fr"
    BALLERINE_API_KEY: "webhook-shared-secret-secret"
    KYC_PROXY_URL: "https://apim.nbank.fr"
    KYC_TIMEOUT: 300000
    KYC_MAX_RETRIES: 3
    ML_BACKEND_URL: "http://localhost:8000"
    JSON_BODY_LIMIT: "20mb"
    # Liveness gate: the final submit is refused unless the ML backend recorded a
    # pass for the challenge id sent with it. Keep the bypass off.
    LIVENESS_PASS_TTL_MS: 900000
    ALLOW_LIVENESS_BYPASS: "false"
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  ingress:
    enabled: false
    ingressClassName: "nginx"
    annotations: {}
    hosts: []
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
  extraEnv: |
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/certificate/ca.pem
  extraVolumes:
    - name: certificate
      configMap:
        name: kyc-ca-config-map
  extraVolumeMounts:
    - name: certificate
      mountPath: /etc/certificate
      readOnly: true
